[package]
name = "reel-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal media inspector powered by ffprobe"
license = "MIT"
repository = "https://github.com/rahmerh/reel-tui"

[lib]
name = "reel_tui"
path = "src/lib.rs"

[[bin]]
name = "reel"
path = "src/main.rs"

# Real end-to-end tests: they drive the app through keypresses and run actual
# ffmpeg/ffprobe subprocesses, so they are excluded from `cargo test` and run
# explicitly with `cargo test --test e2e`.
[[test]]
name = "e2e"
path = "tests/e2e.rs"
test = false

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
isolang = { version = "2.0", features = ["list_languages"] }
notify = "8.2"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.4"
unicode-width = "0.2"

[dev-dependencies]
kernal = "0.5.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
