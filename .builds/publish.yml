# Publishes a release tag to crates.io. builds.sr.ht runs every manifest on
# every push and has no tag filter, so the first task ends the build early
# unless the push was a release tag. The crates.io token is a builds.sr.ht file
# secret written to ~/.cargo/credentials.toml.
image: archlinux
packages:
  - alsa-lib
  - curl
  - ffmpeg
  - icu
  - pkgconf
  - rust
  - tesseract
  - tesseract-data-eng
  - ttf-dejavu
  - python
sources:
  - https://git.sr.ht/~rahmerh/reel-tui
secrets:
  - 23a611fd-d783-4850-8da5-2637674763bb
tasks:
  - release-tag: |
      case "${GIT_REF:-}" in
        refs/tags/[0-9]*.[0-9]*.[0-9]*) ;;
        *) echo "Not a release tag (${GIT_REF:-none}), nothing to publish"; complete-build ;;
      esac
      echo "RELEASE_VERSION=${GIT_REF#refs/tags/}" >> ~/.buildenv
  - tag-on-main: |
      cd reel-tui
      git fetch -q origin main
      if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
        echo "Tag $RELEASE_VERSION does not point to a commit reachable from main." >&2
        exit 1
      fi
  - media-tools: |
      cd reel-tui
      bash .builds/media-tools.sh
  - set-version: |
      cd reel-tui
      python3 .builds/set-version.py
      git diff --check
  - fmt: |
      cd reel-tui
      cargo fmt --check
  - clippy: |
      cd reel-tui
      cargo clippy --locked --all-targets -- -D warnings
  - unit-tests: |
      cd reel-tui
      cargo test --locked
  # A separate cargo target with `test = false`, so the run above does not reach
  # it. Publishing without it would ship the real remux paths untested.
  - e2e-tests: |
      cd reel-tui
      cargo test --locked --test e2e
  - build-release: |
      cd reel-tui
      cargo build --release --locked
  - verify-package: |
      cd reel-tui
      cargo publish --dry-run --locked --allow-dirty
  - publish: |
      cd reel-tui
      if [ ! -f ~/.cargo/credentials.toml ]; then
        echo "The crates.io token secret is not configured." >&2
        exit 1
      fi
      cargo publish --locked --allow-dirty
