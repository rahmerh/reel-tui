# Nothing ran on `main` before CI existed: the publish manifest only does work
# on release tags, so the first time a change met CI was the moment it was being
# published. Two failures reached `main` that way and only surfaced when a tag
# was cut. builds.sr.ht runs this on every push, to any branch.
image: archlinux
packages:
  - alsa-lib
  - curl
  - ffmpeg
  - icu
  - pkgconf
  - rust
  - tesseract
  - tesseract-data-eng
  - ttf-dejavu
sources:
  - https://git.sr.ht/~rahmerh/reel-tui
tasks:
  - media-tools: |
      cd reel-tui
      bash .builds/media-tools.sh
  - fmt: |
      cd reel-tui
      cargo fmt --check
  - clippy: |
      cd reel-tui
      cargo clippy --locked --all-targets -- -D warnings
  - unit-tests: |
      cd reel-tui
      cargo test --locked
  # A separate cargo target with `test = false`, so `cargo test` above does not
  # reach it. It is the only suite that exercises the real remux paths.
  - e2e-tests: |
      cd reel-tui
      cargo test --locked --test e2e
